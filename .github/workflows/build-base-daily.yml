name: Build base daily

on:
  schedule:
    - cron: '30 3 * * *'
      timezone: Asia/Taipei
  workflow_dispatch:

env:
  TZ: Asia/Taipei

jobs:
  generate-matrix:
    name: Generate matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.create-matrix.outputs.matrix_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create matrix
        id: create-matrix
        run: |
          matrix_json=$(
            find base -type f -name Dockerfile -printf '%h\n' |
              jq -Rsc 'split("\n")[:-1] | {include: map({context: ., tag: (split("/") | last)})}'
          )
          echo "matrix_json=$matrix_json" >> "$GITHUB_OUTPUT"

  daily-build:
    name: Build base image
    needs: generate-matrix
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ matrix.tag }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-${{ matrix.tag }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ matrix.tag }}-buildx-

      - name: Start ssh-agent and add key
        shell: bash
        run: |
          eval "$(ssh-agent -s)"
          echo "${{ secrets.CI_SSH_PRIVATE_KEY }}" | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          tags: |
            ${{ github.repository }}:${{ matrix.tag }}
            ghcr.io/${{ github.repository }}:${{ matrix.tag }}
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          ssh: default=${{ env.SSH_AUTH_SOCK }}
